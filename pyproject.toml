[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioroute-model-benchmark"
version = "0.1.0"
description = "Calibrated biomedical request router: hosted LLM vs self-hosted encoders."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
transformers = ["torch>=2.2.0", "transformers>=4.40.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
bioroute-bench = "bioroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
