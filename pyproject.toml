[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioroute"
version = "0.2.0"
description = "BioRoute: LLM inference benchmark for healthcare agent routing — latency, accuracy, calibration, cost, and data residency (PyTorch, Hugging Face, Ollama)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sai Akhilesh Vangala" }]
keywords = [
  "llm",
  "routing",
  "calibration",
  "benchmark",
  "healthcare",
  "ollama",
  "modernbert",
  "pytorch",
]
dependencies = [
  "numpy>=1.26.0",
  "scikit-learn>=1.4.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
transformers = ["torch>=2.2.0", "transformers>=4.40.0", "accelerate>=0.30.0"]
plot = ["matplotlib>=3.8.0"]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://github.com/Akhilesh-Vangala/bioroute"
Repository = "https://github.com/Akhilesh-Vangala/bioroute"

[project.scripts]
bioroute-bench = "bioroute.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
